# The independent check (guardrail G8): runs on every pull request into main, outside the
# reach of whoever (or whatever) wrote the change. Required checks in the ruleset: Lint and LWC tests,
# Code Analyzer, Validate on lab-qa (the last one is skipped, and counts as passed, when nothing deployable changed).
# Tool versions match the dev container image sf-dev:2.159.7 (playbook D9).
name: PR check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # lets Code Analyzer post its summary on the PR

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

env:
  SF_CLI_VERSION: 2.159.7
  CODE_ANALYZER_VERSION: 5.16.0
  NODE_VERSION: "26"
  SF_DISABLE_TELEMETRY: "true"

jobs:
  # Re-runs what the Husky pre-commit hook does, so "git commit --no-verify" can't skip it.
  lint-and-unit:
    name: Lint and LWC tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Formatting (Prettier)
        run: npm run prettier:verify
      - name: Lint (ESLint for LWC/Aura)
        run: npm run lint -- --no-error-on-unmatched-pattern
      - name: LWC unit tests (Jest)
        # sfdx-lwc-jest passes options to Jest only after its own "--"
        run: npx sfdx-lwc-jest -- --passWithNoTests

  code-analyzer:
    name: Code Analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install Salesforce CLI + Code Analyzer
        run: |
          npm install --global @salesforce/cli@${{ env.SF_CLI_VERSION }}
          sf plugins install code-analyzer@${{ env.CODE_ANALYZER_VERSION }}
      - name: Run Code Analyzer
        id: sfca
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: --workspace . --target force-app --view detail --output-file sfca_results.html --output-file sfca_results.json
          results-artifact-name: code-analyzer-results
          github-token: ${{ github.token }}
      - name: Quality gate (no Critical or High findings)
        if: steps.sfca.outputs.exit-code > 0 || steps.sfca.outputs.num-sev1-violations > 0 || steps.sfca.outputs.num-sev2-violations > 0
        run: |
          echo "::error::Code Analyzer found Critical/High violations or failed to run. See the job summary."
          exit 1

  # Decides whether the PR touches anything that deploys. If not, "Validate on lab-qa" is skipped.
  # A job skipped by its "if" reports as successful, so it still satisfies the required check in the ruleset.
  # (A path filter on the whole workflow would NOT: the check would stay "pending" and block the PR.)
  changes:
    name: Detect deployable changes
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Changed files that affect deployment
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Manual run: always validate."
            exit 0
          fi
          # Deployable: metadata, project config, and this workflow itself (so pipeline changes get tested).
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
            force-app sfdx-project.json .forceignore .github/workflows/pr-check.yml)
          if [ -n "$changed" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            printf 'Deployable changes:\n%s\n' "$changed"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No deployable changes in this PR, skipping validation on lab-qa."
          fi

  validate:
    name: Validate on lab-qa
    needs: [changes, lint-and-unit, code-analyzer]
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@${{ env.SF_CLI_VERSION }}
      - name: Anything to deploy?
        id: check
        run: |
          if find force-app -type f -name '*-meta.xml' | grep -q .; then
            echo "has_metadata=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_metadata=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No metadata in force-app yet, skipping validation."
          fi
      - name: Log in to lab-qa
        if: steps.check.outputs.has_metadata == 'true'
        env:
          SF_AUTH_URL_QA: ${{ secrets.SF_AUTH_URL_QA }}
        # "-" means "read the value from stdin". Without it the CLI takes the next word (--alias) as the value.
        run: printf '%s' "$SF_AUTH_URL_QA" | sf org login sfdx-url --sfdx-url-stdin - --alias lab-qa
      - name: Check-only deploy + local Apex tests
        if: steps.check.outputs.has_metadata == 'true'
        run: |
          sf project deploy validate --source-dir force-app --target-org lab-qa \
            --test-level RunLocalTests --wait 30 \
            --junit --coverage-formatters json-summary --results-dir test-results
      - name: Upload test results
        if: always() && steps.check.outputs.has_metadata == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apex-test-results
          path: test-results/
          if-no-files-found: ignore
